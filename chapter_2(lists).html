<!DOCTYPE html>                                                                    <!--This tells that, this is a html document-->
<html lang="en">                                                                   <!--the value of lang tells that, in which language the program is written-->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
    <title>lists</title>
</head>
<body>
    <h1>Ordered List</h1>                         <!--There are three types of lists, in html-->
    <h1>Unordered List</h1>
    <h1>Defined List</h1>

    <ol>                                          <!--Ordered List-->
        <li>Breakfast</li>
        <li>Lunch</li>
        <li>Dinner</li>
        <li>Wine</li>
        <li>Vodka</li>
    </ol>

    <ul>                                              <!--Unordered List-->
        <li>Breakfast</li>
        <li>Lunch</li>
        <li>Dinner</li>
        <li>Wine</li>
        <li>Vodka</li>
    </ul>

    <dl>                                            <!--Defined List-->
        <dt>Term</dt>
        <dd>Term Description</dd>
        <dd>Term Description</dd>
    </dl>
</body>
</html>
