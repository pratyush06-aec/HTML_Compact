<!DOCTYPE html>                                                                                  <!--Declares the document type and version of HTML (HTML5)-->
<html lang="en">                                                                                 <!--Starts the HTML document and sets the language to English-->
    <head>                                                                                       <!--Begins the head section, which contains meta-information about the page-->
        <meta charset="UTF-8">                                                                   <!--Sets the character encoding to UTF-8. Generally, it includes all major characters and symbols from all languages-->
        <meta http-equiv="X-UA-Compatible" type="IE-edge">                                       <!--Ensures compatibility with Internet Explorer’s latest rendering engine (should be `content="IE=edge"`)-->
        <meta name="viewpoint" content="width=deive-width, initial-scale=1.0">                   <!--Sets the viewport for responsive design (should be `viewport` and `device-width`)-->
        <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">                <!--Links to the favicon for the page-->
        <title>HTML_page_explanation</title>                                                     <!--Sets the title of the page (shown in the browser tab)-->
    </head>                                                                                      <!--Ends the head section-->
    <body>                                                                                       <!--Begins the body section, which contains the visible content that is displayed on the webpage-->
        <header>
            <!--Defines the header section, typically for site or page titles, navigation, or logos-->
        </header>

        <main>  
            <article>
                <!--Represents a self-contained piece of content (like a blog post or news article) that is to be highlighted across the entire content-->
            </article>

            <aside>
                <!--Contains content related to the main content, such as sidebars or additional info-->
            </aside>
        </main>

        <footer>
            <!--Defines the footer section, usually for copyright, contact info, or links-->
        </footer>
    </body>                                                                                       <!--Closes the body-->
</html>                                                                                           <!--Closes the HTML document-->
