<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" type="IE-edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
        <title>Figures_and_Captions</title>
    </head>
    <body>
        <figure>
            <img src="https://cdn.platformtraining.com/wp-content/uploads/2016/12/panxe-qjwhe-paul-morris.jpg" type="Mountain" width="100%">
            <figcaption >This is a mountain</figcaption>
            <marquee behavior="alternate" direction="right">This is a mountain with a little lake</marquee>
        </figure>
    </body>
</html>




<!--<figure> tag is used to cast an image along with caption using <figcaption> tag-->
<!--marquee tag is used to give styles to the caption, without using css. Here, behavior is used to give the particular pattern to display the caption and direction is used to mention the direction of the behavior-->
