<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewpoint" content="width=device-width, intial-scale=1.0">
        <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
        <title>Table_of_Contents</title>
    </head>
    <body>
        <table>
            <thead>table_of_contents</thead>                                                  <!--table head-->
            <tbody>                                                                           <!--table body-->
                <tr>                                                                          <!--table row-->
                    <th>Name</th>                                                             <!--table heading-->               
                    <th>Food</th>
                    <th>Thing</th>
                    <th>Place</th>
                </tr>
                
                <tr>
                    <td>Pratyush</td>                                                          <!--table data. This represent the respective datas of each table heading-->
                    <td>Budweiser</td>
                    <td>Beer</td>
                    <td>West Bengal</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
