<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets.favicon.png" type="image/x-icon">
        <title>HTML_forms</title>
    </head>
    <body>
        <form action="form.html" method="GET">
            <lable for="name">Name</lable>
            <input type="text" id="name" name="Name" placeholder="Enter your name" required>
            <br>
            <br>

            <lable for="tel">Phone no</lable>
            <input type="tel" id="tel" name="Phone no" placeholder="Enter your phone no" required>
            <br>
            <br>

            <lable for="e-mail">E-mail</lable>
            <input type="e-mail" id="e-mail" name="E-mail" placeholder="Enter your e-mail" required>
            <br>
            <br>

            <lable for="password">Password</lable>
            <input type="password" id="password" name="Password" placeholder="Enter your password" required>
            <br>
            <br>

            <lable for="Roll no">Roll no</lable>
            <input type="search" id="Roll no" name="Roll no" placeholder="&#128269Enter your roll no" required>
            <br>
            <br>

            <lable for="date">Date</lable>
            <input type="date" id="date">
            <br>
            <br>

            <lable for="date">Time</lable>
            <input type="datetime-local" id="time">
            <br>
            <br>

            <lable for="color">Color</lable>
            <input type="color" id="color">
            <br>
            <br>

            <lable for="file">Choose an image</lable>
            <input type="file" multiple accept="images/*" id="file">
            <br>
            <br>

            <lable for="check">Check here</lable>
            <input type="checkbox" id="check" name="check">
            <br>
            <br>

            <lable for="text">Write something here</lable>
            <textarea name="text" id="text" rows="5" colmns="20" placeholder="Write here"></textarea>
            <br>
            <br>

            <lable for="select">Enter True/False</lable>
            <select name="select" id="select">
                <option value="True">True</option>
                <option value="False">False</option>
            </select>
            <br>
            <br>

            <input type="Submit" value="Submit">
        </form>
    </body>
</html>
