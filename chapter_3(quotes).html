<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
    <title>Quotes</title>
</head>
<body>
    <strong>
        <blockquote>                                                                  <!--The <blockquote> tag is used for long quotations that are set apart from the main text, usually displayed as a separate, indented block-->
            <q>                                                                       <!--The <q> tag is used for short, inline quotations and browsers typically add quotation marks around the text-->>
                <p>                                                                   <!--The <p> tag in HTML is used to define a paragraph of text. It creates a block of content with space above and below, making the text easier to read and visually separated from other elements-->
                    If you are not failing, you are not innovating enough.
                </p>
            </q>
        </blockquote>
    </strong>                                                                         <!--This tag is used for making a line bold-->
        <cite>                                                                        <!--The <cite> tag is used to reference the title of a creative work, such as a book, article, or song. It is often used to give credit to the original source of a quote or idea-->                                                           
            <em>                                                                      <!--This tag is used for writing a line in italics-->
                Elon Musk
            </em>
        </cite>
</body>
</html>
