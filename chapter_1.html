<!DOCTYPE html>
<html lang="en">
<head>                                                                                 <!--In between head, there is the description for creating the valid http page-->
    <meta charset= "UTF-8">
    <meta https-equiv= "X-UA-Compatible" content= "IE=edge">
    <meta name= "viewport" content= "width=device-width, initial-scale=1.0">
    <link rel= "shortcut icon" href= "assets/favicon.png" type= "image/x-icon">
    <title> Paragraph, Headlines, Small Texts, Subscripts & Superscripts</title>
</head>
<body>                                                                                  <!--In between body, there is the content of the page-->
    <p><em>Hello everyone!!!!,</em></p>
    <h1> Welcome to this bootcamp!!! </h1>
    <h2> Welcome to this bootcamp!!! </h2>
    <h3> Welcome to this bootcamp!!! </h3>
    <h4> Welcome to this bootcamp!!! </h4>
    <h5> Welcome to this bootcamp!!! </h5>
    <h6> Welcome to this bootcamp!!! </h6>

    <!--Subscripts-->

    <>
        <strong>H<sub>2</sub>O</strong>          <!--sub is used for subscripts-->
    </p>

    <!--Superscripts-->

    <p>
        (a+b)<sup>2</sup>                        <!--sup is used for superscripts-->
    </p>
</body>
</html>
