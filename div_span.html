<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" type="IE-edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
        <title>div_span</title>
    </head>
    <body>
        <div class="container">
            <h1>This is a heading</h1>
            <p>The is a line</p>
            <span><p>The is a line</p></span>
            <p>The is a line</p>
        </div>
    </body>
</html>




<!--<div> is a block container, i.e., it contains several paragraphs within itself-->
<!--<span> is an inline container, i.e., it contain a single word or paragraph or line within itself-->
