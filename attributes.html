<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE-edge">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="/assets/favicon.png" type="image/x-icon">
        <title>HTML Attributes</title>
    </head>
    <body>
        <p class="para">Description</p>                                               <!--class is an attribute used for styling that particular line, where it's applied and same class can be used for multiple lines-->
        <p id="one">Description</p>                                                   <!--id is always unique, i.e. same id can't be used for other lines and it's used for uniquely identifying an element or a line-->
        <p lang="en">Description</p>                                                  <!--by using the lang attribute i.e. language, we can change the language of the content-->
        <p dir="ltr">Description</p>                                                  <!--dir attribute is used for mentioning particular direction for a line-->   
        <p contenteditable="True" dir="rtl">Description</p>                           <!--contenteditable attribute is for editing a line or an element in the web page, only if it's value is true-->
    </body>
</html>
